[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# Arti 0.47 needs Rust 1.92 or newer (`rustup update`).
rust-version = "1.92"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
aura = { path = "../../aura" }
tokio = { version = "1.53.2", features = ["sync"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"

# Arti checks the consensus signatures and builds circuits with heavy crypto. Unoptimized, that
# makes connecting to Tor under `tauri dev` take minutes on a slow laptop, so dependencies are
# always built optimized (our own code still compiles quickly in debug mode).
[profile.dev.package."*"]
opt-level = 2
