[package]
name = "aura"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
argon2 = "0.6.0"
arti-client = "0.47.0"
chacha20poly1305 = "0.11.0"
hex = "0.4.3"
keepass = "0.13.10"
libp2p = { version = "0.57.0", features = ["tokio", "macros", "kad", "ping", "identify", "noise", "yamux"] }
rand = "0.8.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sequoia-openpgp = { version = "2.3.0", default-features = false, features = ["crypto-cng"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
tor-hsservice = "0.47.0"
tor-rtcompat = "0.47.0"
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Threading"] }
zeroize = { version = "1.9.0", features = ["derive"] }
